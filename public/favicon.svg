<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cosmic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#14112e" />
      <stop offset="100%" stop-color="#1a0b2e" />
    </linearGradient>
    <linearGradient id="nebula-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="center-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#cosmic-bg)" />
  <rect width="64" height="64" rx="16" stroke="url(#nebula-ring)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Stellar Orbit 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#nebula-ring)" stroke-width="2" stroke-dasharray="3 2" transform="rotate(-30 32 32)" opacity="0.85" filter="url(#glow)" />
  
  <!-- Outer Stellar Orbit 2 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="#38bdf8" stroke-width="1.8" transform="rotate(35 32 32)" opacity="0.75" />

  <!-- Background Ambient Glow -->
  <circle cx="32" cy="32" r="14" fill="url(#center-flare)" />

  <!-- Multi-modal Data Fusion Beams -->
  <path d="M 32 10 L 32 54" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <path d="M 10 32 L 54 32" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <!-- Orbiting Data Points -->
  <circle cx="48" cy="22" r="2.2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="16" cy="42" r="2" fill="#ec4899" filter="url(#glow)" />
  <circle cx="20" cy="18" r="1.5" fill="#facc15" />
  <circle cx="45" cy="46" r="1.5" fill="#a78bfa" />

  <!-- Central Star / Cosmic Core -->
  <path d="M 32 20 Q 32 32 20 32 Q 32 32 32 44 Q 32 32 44 32 Q 32 32 32 20 Z" fill="url(#core-glow)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" />
</svg>
